<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Attendance Status</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial, sans-serif;
background-color:#f4f4f9;
color:#333;
}

.container{
width:100%;
max-width:700px;
margin:0 auto;
padding:60px 20px;
}

.header{
text-align:center;
background-color:#0078d4;
color:#fff;
padding:30px 20px;
border-radius:8px;
margin-bottom:30px;
}

.operator-info{
margin-top:20px;
font-size:16px;
}

.main-content{
margin-top:40px;
display:grid;
grid-template-columns:1fr;
gap:30px;
}

.check-section,.results-section{
padding:30px;
background-color:#fff;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.check-section h2,.results-section h2{
margin-bottom:20px;
text-align:center;
font-size:20px;
}

.roll-input{
width:80%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:5px;
margin-bottom:20px;
}

.check-btn{
padding:12px 24px;
background-color:#0078d4;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
font-size:18px;
}

.check-btn:hover{
background-color:#005c9e;
}

.results-section{
background-color:#f9f9f9;
border-left:5px solid #0078d4;
text-align:center;
}

.result-card{
margin-top:20px;
font-size:17px;
line-height:1.8;
}

.status-present{
color:green;
font-weight:bold;
}

.status-absent{
color:red;
font-weight:bold;
}

.logout-btn{
background-color:#f44336;
color:white;
padding:12px 24px;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
margin:30px auto;
display:block;
}

.logout-btn:hover{
background-color:#d32f2f;
}

@media (max-width:768px){

.container{
padding:50px 15px;
}

.roll-input{
width:100%;
}

.check-btn{
font-size:16px;
padding:10px 20px;
}

.logout-btn{
font-size:16px;
padding:10px 20px;
}

}
</style>
</head>

<body>

<div class="container">

<header class="header">
<h1>Face Biometric Operator Interface</h1>

<div class="operator-info">
<p>Operator: John Doe</p>
<p>Operator ID: 12345</p>
</div>
</header>

<main class="main-content">

<section class="check-section">

<h2>Check Candidate Attendance</h2>

<input type="text" class="roll-input" placeholder="Enter Candidate Roll Number">

<button class="check-btn">Check Status</button>

</section>


<section class="results-section">

<h2>Attendance Status</h2>

<div class="result-card">

<p><strong>Candidate Name:</strong> Rahul Sharma</p>

<p><strong>Roll Number:</strong> 202501234</p>

<p><strong>Exam Center:</strong> ABC Examination Center</p>

<p><strong>Status:</strong> <span class="status-present">Present</span></p>

</div>

</section>

</main>

<footer class="footer">
<button class="logout-btn">Logout</button>
</footer>

</div>

</body>
</html>
