<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Screen - Face Biometric Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            background-color: #0078d4;
            color: #fff;
            padding: 30px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .operator-info {
            margin-top: 20px;
            font-size: 16px;
        }

        .main-content {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .scan-section, .results-section {
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .scan-section h2, .results-section h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }

        .scan-options {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scan-btn {
            padding: 12px 24px;
            background-color: #0078d4;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .scan-btn:hover {
            background-color: #005c9e;
        }

        .scan-result {
            margin-top: 25px;
            font-size: 16px;
            text-align: center;
        }

        .results-section {
            background-color: #f9f9f9;
            border-left: 5px solid #0078d4;
        }

        .results-section p {
            font-size: 18px;
            font-weight: 600;
            margin-top: 20px;
            text-align: center;
        }

        .logout-btn {
            background-color: #f44336;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin: 30px auto;
            display: block;
        }

        .logout-btn:hover {
            background-color: #d32f2f;
        }

        @media (max-width: 768px) {
            .container {
                padding: 50px 15px;
            }

            .scan-btn {
                font-size: 16px;
                padding: 10px 20px;
            }

            .scan-result {
                font-size: 14px;
            }

            .header {
                font-size: 18px;
            }

            .logout-btn {
                font-size: 16px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Face Biometric Operator Interface</h1>
            <div class="operator-info">
                <p>Operator: John Doe</p>
                <p>Operator ID: 12345</p>
            </div>
        </header>

        <main class="main-content">
            <section class="scan-section">
                <h2>Scan Biometric Data</h2>
                <div class="scan-options">
                    <button class="scan-btn">Start Scan</button>
                </div>
                <div class="scan-result">
                    <p>Scan Result: <span>No scan initiated</span></p>
                </div>
            </section>

            <section class="results-section">
                <h2>Scan Results</h2>
                <div id="results-display">
                    <p>No results yet.</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <button class="logout-btn">Logout</button>
        </footer>
    </div>
</body>
</html>
