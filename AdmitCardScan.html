<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Admit Card Scan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial, sans-serif;
background:#f4f4f9;
color:#333;
}

.container{
width:100%;
max-width:550px;
margin:auto;
padding:60px 20px;
}

.main-content{
display:grid;
grid-template-columns:1fr;
gap:30px;
}

.scan-section,
.results-section{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.scan-section h2,
.results-section h2{
margin-bottom:20px;
font-size:20px;
}

.scan-frame{
width:260px;
height:170px;
border:3px dashed #0078d4;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
background:#fafafa;
}

.admit-card{
width:200px;
height:120px;
background:white;
border:2px solid #ccc;
border-radius:6px;
padding:8px;
font-size:10px;
}

.card-header{
font-weight:bold;
text-align:center;
margin-bottom:5px;
}

.card-row{
display:flex;
justify-content:space-between;
margin-bottom:3px;
}

.qr{
width:35px;
height:35px;
background:#000;
margin:auto;
margin-top:4px;
}

.scan-line{
position:absolute;
width:100%;
height:3px;
background:red;
animation:scan 2s infinite;
}

@keyframes scan{
0%{top:0}
50%{top:100%}
100%{top:0}
}

.scan-btn{
margin-top:20px;
padding:12px 24px;
background:#0078d4;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

.scan-btn:hover{
background:#005c9e;
}

.scan-result{
margin-top:20px;
font-size:16px;
text-align:center;
}

.results-section{
background:#f9f9f9;
border-left:5px solid #0078d4;
}

.results-section p{
font-size:18px;
font-weight:600;
margin-top:20px;
}

.logout-btn{
background:#f44336;
color:white;
padding:12px 24px;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
margin:30px auto;
display:block;
}

.logout-btn:hover{
background:#d32f2f;
}

@media(max-width:768px){

.container{
padding:40px 15px;
}

.scan-btn{
font-size:16px;
padding:10px 20px;
}

.logout-btn{
font-size:16px;
padding:10px 20px;
}

}

</style>
</head>

<body>

<div class="container">

<main class="main-content">

<section class="scan-section">

<h2>Scan Candidate Admit Card</h2>

<div class="scan-frame">

<div class="scan-line"></div>

<div class="admit-card">

<div class="card-header">EXAM ADMIT CARD</div>

<div class="card-row">
<span>Name:</span>
<span>Candidate</span>
</div>

<div class="card-row">
<span>Roll No:</span>
<span>102345</span>
</div>

<div class="card-row">
<span>Center:</span>
<span>Delhi</span>
</div>

<div class="qr"></div>

</div>

</div>

<button class="scan-btn">Start Admit Card Scan</button>

<div class="scan-result">
<p>Scan Result: <span>No card scanned</span></p>
</div>

</section>


<section class="results-section">

<h2>Candidate Verification</h2>

<div id="results-display">
<p>No candidate verified yet.</p>
</div>

</section>

</main>

<footer>
<button class="logout-btn">Logout</button>
</footer>

</div>

</body>
</html>
